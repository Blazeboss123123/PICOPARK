<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huddle Peak</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: playful co-op arcade, cosy and chaotic
   IDEA: the whole window is the game; five painted worlds on the climb to the peak
   PICTURE: full-bleed pixel-art scene with menus floating over it
   COLOUR and TYPE: deep dusk purple panels, gold accent; Press Start 2P for labels
   LAYOUT: canvas fills the viewport; panels centred; controls shown only in menus */
:root{color-scheme:dark;--bg:#120a26;--panel:#1c1138;--ink:#efeaff;--mut:#a99dd4;--line:#34245e;--teal:#2ec4b6;--gold:#ffd23f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#05030c;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#screen{position:fixed;inset:0;width:100vw;height:100vh;display:block;outline:none;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(12px,3vh,40px) clamp(12px,4vw,64px) clamp(44px,7vh,70px)}
#ui:empty{display:none}
#ui::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 80% at 50% 50%,rgba(8,4,20,.7),rgba(5,2,12,.93))}
#ui.s-title::before{background:linear-gradient(rgba(5,2,12,.72),rgba(5,2,12,.1) 30%,rgba(5,2,12,.25) 55%,rgba(5,2,12,.9) 100%),radial-gradient(ellipse 40% 42% at 50% 74%,rgba(5,2,12,.55),transparent)}
#ui.s-levels::before,#ui.s-lobby::before{background:linear-gradient(90deg,rgba(5,2,12,.93),rgba(5,2,12,.78) 45%,rgba(5,2,12,.5) 80%,rgba(5,2,12,.62)),linear-gradient(transparent 55%,rgba(5,2,12,.75))}
.scr{position:relative;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,22px);width:100%;max-height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;text-align:center}
.px{font-family:"Press Start 2P",monospace;font-weight:400}
/* logo */
.logo{position:relative;display:flex;flex-direction:column;align-items:center;margin-bottom:clamp(4px,3.5vh,44px)}
.logo h1{margin:0;font:400 clamp(28px,min(8vw,11vh),104px)/1.05 "Press Start 2P",monospace;letter-spacing:.03em;filter:drop-shadow(0 .055em 0 #c2471c) drop-shadow(0 .055em 0 #5a1a3e) drop-shadow(0 .12em 0 rgba(0,0,0,.5))}
.logo h1 span,.big span{display:block;background:linear-gradient(#fffbea 0 24%,#ffe683 24% 48%,#ffc53a 48% 74%,#ff9529 74%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo h1 .l2{font-size:1.32em;letter-spacing:.12em;margin-top:.04em}
.logo canvas{display:block;image-rendering:pixelated;pointer-events:none;margin-bottom:-2px}
.mi[hidden]{display:none!important}
.lvl .mi .ck{font:700 16px/1 system-ui,sans-serif}
.tag{font:400 clamp(8px,1.1vw,12px)/1.6 "Press Start 2P",monospace;color:#d8cdfa;letter-spacing:.14em;text-shadow:0 2px 0 #160c2e;margin-top:clamp(10px,2.4vh,24px);opacity:.9}
.big{margin:0;font:400 clamp(22px,min(5vw,8vh),56px)/1.1 "Press Start 2P",monospace;letter-spacing:.04em;filter:drop-shadow(0 .06em 0 #c2471c) drop-shadow(0 .06em 0 #5a1a3e) drop-shadow(0 .12em 0 rgba(0,0,0,.5))}
.sub{font:400 clamp(9px,1.2vw,12px)/1.7 "Press Start 2P",monospace;color:#d8cdfa;letter-spacing:.08em;text-shadow:0 2px 0 #160c2e;margin:0}
.note{margin:0;color:#b9addf;font-size:clamp(13px,1.4vw,15px);max-width:46ch;text-shadow:0 1px 2px #000}
/* menu items */
.menu{display:flex;flex-direction:column;align-items:center;gap:clamp(0px,.6vh,6px)}
button{appearance:none;background:none;border:0;color:inherit;font:inherit;padding:0;margin:0;cursor:pointer}
button:focus{outline:none}
.mi{position:relative;padding:.6em 1.9em;font:400 clamp(12px,min(2vw,3vh),22px)/1 "Press Start 2P",monospace;color:#b7abdf;letter-spacing:.07em;text-shadow:0 3px 0 #120a26,0 0 14px rgba(0,0,0,.6);white-space:nowrap;transition:color .08s,transform .08s}
.mi::before,.mi::after{content:'';position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,currentColor 20%,currentColor 80%,transparent);opacity:0;transition:opacity .1s}
.mi::before{top:0}.mi::after{bottom:0}
.mi.on{color:var(--gold);transform:scale(1.06)}
.mi.on::before,.mi.on::after{opacity:.85}
.mi i.ar{position:absolute;top:50%;width:.5em;height:.6em;margin-top:-.3em;background:currentColor;opacity:0;clip-path:polygon(0 0,100% 50%,0 100%)}
.mi i.ar.l{left:.45em}.mi i.ar.r{right:.45em;clip-path:polygon(100% 0,0 50%,100% 100%)}
.mi.on i.ar{opacity:1;animation:nudge .7s steps(2) infinite}
.mi i.ar.r{animation-direction:reverse}
@keyframes nudge{50%{transform:translateX(.18em)}}
.mi small{color:#7ff0e0;font-size:.75em;margin-left:.8em}
.mi:disabled{color:#5a4f86;cursor:default}
.mi.sm{font-size:clamp(11px,min(1.5vw,2.6vh),16px)}
/* hint bar */
.hints{position:absolute;left:0;right:0;bottom:clamp(10px,2.2vh,22px);display:flex;justify-content:center;gap:6px 22px;flex-wrap:wrap;color:#a99dd4;font-size:13px;pointer-events:none;text-shadow:0 1px 2px #000;padding:0 90px}
.ver{position:absolute;right:clamp(10px,2vw,22px);bottom:clamp(10px,2.2vh,22px);font:400 9px/1 "Press Start 2P",monospace;color:#7f74aa;letter-spacing:.1em}
.who{position:absolute;left:clamp(10px,2vw,22px);bottom:clamp(10px,2.2vh,22px);font:400 9px/1 "Press Start 2P",monospace;color:#7f74aa;letter-spacing:.1em}
kbd{display:inline-block;font:600 11px/1 system-ui,sans-serif;color:#efeaff;background:#241848;border:1px solid #4a3888;border-bottom-width:3px;border-radius:4px;padding:3px 6px 2px;margin:0 2px;min-width:20px;text-align:center}
/* level select */
.lvsel{flex-direction:row;align-items:stretch;justify-content:center;gap:clamp(16px,4vw,64px);max-width:1180px;text-align:left}
.lvcol{display:flex;flex-direction:column;gap:clamp(6px,1.6vh,16px);min-width:min(340px,100%)}
.whead{display:flex;align-items:center;gap:12px}
.wnav{width:34px;height:34px;flex:none;display:grid;place-items:center;color:#b7abdf}
.wnav:hover{color:var(--gold)}
.wnav i{width:12px;height:14px;background:currentColor;clip-path:polygon(100% 0,0 50%,100% 100%)}
.wnav.nx i{clip-path:polygon(0 0,100% 50%,0 100%)}
.wname{flex:1;text-align:center}
.wname small{display:block;font:400 9px/1.6 "Press Start 2P",monospace;color:#a99dd4;letter-spacing:.16em}
.wname b{display:block;font:400 clamp(14px,min(2.2vw,3.6vh),24px)/1.3 "Press Start 2P",monospace;color:#fff;text-shadow:0 3px 0 var(--wc,#3d2a70)}
.pips{display:flex;gap:6px;justify-content:center;margin-top:8px}
.pips i{width:22px;height:5px;background:#2e2256}.pips i.on{background:var(--wc,#ffd23f);box-shadow:0 0 8px var(--wc)}
.lvl{align-items:stretch;gap:2px}
.lvl .mi{display:flex;align-items:center;gap:.9em;text-align:left;padding:.75em 1.6em .75em 1.9em;font-size:clamp(11px,min(1.5vw,2.7vh),16px);transform:none}
.lvl .mi.on{transform:translateX(6px)}
.lvl .mi b{font-weight:400;color:#7166a8;min-width:2.2em}.lvl .mi.on b{color:#fff}
.lvl .mi .ck{margin-left:auto;color:#5ee08a;font-style:normal}
.lvl .mi.pick b{color:#7ff0e0}.lvl .mi.pick .ck::after{content:' ◆';color:#7ff0e0}
.lvinfo{display:flex;flex-direction:column;gap:12px;width:min(520px,46vw);align-self:flex-start}
.lvinfo .mm{width:100%;aspect-ratio:16/5;height:auto;object-fit:contain;image-rendering:pixelated;border:2px solid rgba(255,255,255,.14);background:#0a0618;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.lvinfo h3{margin:0;font:400 clamp(16px,min(2.4vw,4vh),28px)/1.3 "Press Start 2P",monospace;color:#fff;text-shadow:0 3px 0 var(--wc,#3d2a70)}
.lvinfo h3 small{display:block;font-size:.4em;color:#a99dd4;letter-spacing:.16em;margin-bottom:.8em;text-shadow:none}
.lvinfo p{margin:0;height:2.9em;overflow:hidden;color:#e2dbff;font-size:clamp(14px,1.5vw,17px);text-shadow:0 1px 2px #000}
.chips{display:flex;flex-wrap:wrap;gap:6px;height:54px;overflow:hidden;align-content:flex-start}
.chips span{font:400 9px/1 "Press Start 2P",monospace;letter-spacing:.06em;padding:6px 8px;color:#e9e4ff;background:rgba(255,255,255,.08);border-left:3px solid var(--wc,#ffd23f)}
.status{font:400 10px/1.4 "Press Start 2P",monospace;color:#a99dd4;letter-spacing:.08em}.status.ok{color:#5ee08a}
/* controls */
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:clamp(10px,2vw,22px);width:min(980px,100%);text-align:left}
.cc{padding:12px 14px;background:rgba(10,6,24,.55);border-top:3px solid var(--pc,#4a3888)}
.cc h4{margin:0 0 10px;font:400 10px/1.4 "Press Start 2P",monospace;color:var(--pc,#fff);letter-spacing:.1em}
.cc div{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#d6cff2;font-size:13px;padding:3px 0}
/* online + lobby */
.field{display:flex;flex-direction:column;align-items:center;gap:6px}
.field label{font:400 9px/1 "Press Start 2P",monospace;color:#a99dd4;letter-spacing:.16em}
input{font:400 clamp(13px,1.6vw,18px)/1 "Press Start 2P",monospace;color:#fff;background:rgba(10,6,24,.6);border:0;border-bottom:3px solid #4a3888;border-radius:0;padding:12px 14px 10px;width:min(320px,80vw);text-align:center;letter-spacing:.08em}
input::placeholder{color:#5a4f86}
input:focus,input.on{outline:none;border-bottom-color:var(--gold);background:rgba(30,18,60,.7)}
input.code{text-transform:uppercase;letter-spacing:.4em;width:min(220px,60vw)}
.or{font:400 9px/1 "Press Start 2P",monospace;color:#6f64a0;letter-spacing:.2em;display:flex;align-items:center;gap:14px}
.or::before,.or::after{content:'';width:60px;height:2px;background:#3a2c6a}
.err{color:#ff8f8f;font-size:14px;min-height:1.4em;text-shadow:0 1px 2px #000}
.lobby{flex-direction:row;align-items:stretch;justify-content:center;gap:clamp(16px,4vw,60px);max-width:1180px;text-align:left}
.roomc{display:flex;flex-direction:column;gap:clamp(8px,1.8vh,16px);min-width:280px;max-width:380px}
.bigcode{font:400 clamp(30px,min(6vw,9vh),64px)/1 "Press Start 2P",monospace;color:var(--gold);letter-spacing:.18em;text-shadow:0 4px 0 #8a4a10,0 8px 0 rgba(0,0,0,.4)}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.pl{display:flex;align-items:center;gap:8px;padding:4px 8px;min-width:0;background:rgba(10,6,24,.5);border-left:4px solid var(--pc)}
.pl canvas{width:24px;height:32px;image-rendering:pixelated}
.pl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 10px/1.4 "Press Start 2P",monospace;color:#fff}.pl small{display:block;color:#a99dd4;font:12px system-ui,sans-serif}
/* win */
.stats{display:flex;gap:clamp(18px,4vw,48px);justify-content:center}
.stat{display:flex;flex-direction:column;gap:8px;align-items:center}
.stat small{font:400 9px/1 "Press Start 2P",monospace;color:#a99dd4;letter-spacing:.16em}
.stat b{font:400 clamp(18px,2.6vw,28px)/1 "Press Start 2P",monospace;color:#fff;text-shadow:0 3px 0 #3d2a70}
.stat b.bad{color:#ff8f8f}
@media(max-width:760px){.lvsel,.lobby{flex-direction:column;align-items:center;overflow:auto}.lvinfo{width:100%}.hints{padding:0 10px;font-size:12px}.ver,.who{display:none}}
@media(max-height:520px){.logo canvas{display:none}.tag{display:none}}
</style></head><body>
<canvas id="screen" tabindex="0" aria-label="Huddle Peak game screen"></canvas><div id="ui"></div>

<script src="game.js"></script>
<script src="art.js"></script>
<script>
{
const H=window.HP,TS=H.TS,VW=H.VW,VH=H.VH,ROWS=H.ROWS;
const ONLINE_OK=!window.HP_STANDALONE&&/^https?:$/.test(location.protocol);
const scr=document.getElementById('screen'),sctx=scr.getContext('2d'),ui=document.getElementById('ui');
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rs=7;const rnd=()=>(rs=(rs*16807)%2147483647)/2147483647;

// ---------- art module and view ----------
const ART=window.HPArt,{PB,pk,rgb,mixh,h1,h2,vn,fbm,vn2,bay,buildBG,buildWorld}=ART;
let BW=640,BH=360,VWv=VW,VHv=VH,DPR=1,VZW=VW,VZH=VH,HDX=0,BGS=1,LOWQ=(()=>{try{return localStorage.getItem('hp-fast')==='1'}catch(e){return false}})(),drawEMA=0,slowN=0;
const bgC=mk(BW,BH),bgX=bgC.getContext('2d'),scene=mk(BW*2+8,BH*2+8),sceneX=scene.getContext('2d'),up=mk(8,8),upX=up.getContext('2d'),vig=mk(8,8);let x=sceneX;

// ---------- characters ----------
const PAL=[{H:'#e8833a',h:'#ffb46a',d:'#b0582a',S:'#2ec4b6',s:'#1a8a80',n:'Orange'},{H:'#2ec4b6',h:'#8ff5e8',d:'#1a8a80',S:'#ffcf4a',s:'#c99a1e',n:'Teal'},{H:'#e85a8a',h:'#ff9ec0',d:'#a83862',S:'#f5f8ff',s:'#b8c6ee',n:'Pink'},{H:'#f2c53a',h:'#fff09a',d:'#b88a1a',S:'#e8505a',s:'#a83038',n:'Yellow'},{H:'#9a6af0',h:'#cbb0ff',d:'#6440b0',S:'#ffd23f',s:'#c99a1e',n:'Purple'},{H:'#5cc046',h:'#a8ee7c',d:'#3a8a2c',S:'#e85a8a',s:'#a83862',n:'Green'},{H:'#3f86ea',h:'#90c2ff',d:'#2a58a8',S:'#ff8a3a',s:'#c05a1a',n:'Blue'},{H:'#e6e8f2',h:'#ffffff',d:'#a2a8c4',S:'#e8404a',s:'#a82a32',n:'White'}];
PAL.forEach(p=>{p.hh=mixh(p.h,'#ffffff',0.55);p.dd=mixh(p.d,'#1a0f24',0.35)});
const SPR=PB(24,32),sprC=mk(24,32),sprX=sprC.getContext('2d');
const MASK=new Uint8Array(24*32);
{const cx=12,cy=12.6,rx=9.4,ry=9.0;for(let y=0;y<32;y++)for(let xx=0;xx<24;xx++){const nx=(xx+0.5-cx)/rx,ny=(y+0.5-cy)/ry;if(nx*nx+ny*ny<=1)MASK[y*24+xx]=1}[[11,3],[12,2],[12,3],[13,2],[13,1],[14,1],[14,0]].forEach(([a,b])=>MASK[b*24+a]=1)}
function charSprite(p,t){const P=PAL[p.slot],S=SPR;S.u.fill(0);const K='#1a0f24';
 const moving=Math.abs(p.vx)>12&&p.grounded,air=!p.grounded,rowing=p.row>0,ph=p.anim*9;
 const bob=(!moving&&!air&&Math.floor(t*2.2+p.slot)%2)?1:0;
 const leg=(lx,dx,lift)=>{for(let y=20;y<=26-lift;y++){const k=(y-20)/6,ox=Math.round(dx*k);S.s(lx-1+ox,y,K);S.s(lx+ox,y,P.d);S.s(lx+1+ox,y,P.dd);S.s(lx+2+ox,y,K)}const fy=27-lift,fx=lx-1+dx;S.r(fx,fy,6,3,K);S.r(fx+1,fy+1,4,1,'#2a1a2e');S.s(fx+1,fy+1,'#5a4a5e');S.s(fx+4,fy+1,'#3a2a3e')};
 if(air){leg(7,-1,p.vy<0?2:1);leg(14,1,p.vy<0?2:0)}
 else if(moving||rowing){const a=Math.sin(ph),b=Math.sin(ph+Math.PI);leg(7,Math.round(a*2.5),a>0.3?Math.round(a*2):0);leg(14,Math.round(b*2.5),b>0.3?Math.round(b*2):0)}
 else{leg(7,0,0);leg(14,0,0)}
 for(let y=0;y<24;y++)for(let xx=0;xx<24;xx++){if(!MASK[y*24+xx])continue;const yy=y+bob,edge=!MASK[(y-1)*24+xx]||!MASK[(y+1)*24+xx]||!MASK[y*24+xx-1]||!MASK[y*24+xx+1];if(edge){S.s(xx,yy,K);continue}const nx=(xx+0.5-12)/9.4,ny=(y+0.5-12.6)/9;const l=-(nx*0.55+ny*0.8);S.s(xx,yy,l>0.62?P.hh:l>0.32?P.h:l<-0.5?P.dd:l<-0.22?P.d:P.H)}
 const B=bob;S.s(7,6+B,P.hh);S.s(8,6+B,P.hh);S.s(7,7+B,P.hh);
 for(let xx=3;xx<=20;xx++)for(let y=16;y<=18;y++){if(!MASK[y*24+xx]||!MASK[y*24+xx-1]||!MASK[y*24+xx+1])continue;S.s(xx,y+B,y===18||(xx%5===0)?P.s:P.S)}
 S.r(17,16+B,3,4,P.S);S.s(19,19+B,P.s);S.s(17,19+B,K);S.s(20,17+B,K);
 const tw=moving||air||rowing?Math.sin(t*14+p.slot):Math.sin(t*3+p.slot)*0.4;for(let i=0;i<5;i++){const tx=3-i,ty=Math.round(17+i*0.5+tw*(i*0.45));S.s(tx,ty+B,P.S);S.s(tx,ty+1+B,i%2?P.s:P.S)}
 const blink=p.blinkT<0.13;
 for(const ex of [13,17]){if(blink){S.r(ex,11+B,3,1,'#160c2e');continue}S.r(ex,9+B,3,4,'#ffffff');S.r(ex+1,10+B,2,3,'#160c2e');S.s(ex+1,10+B,'#ffffff');S.s(ex,9+B,'#e8e6f8')}
 S.s(12,14+B,'#ff8fa0');S.s(13,14+B,'#ff8fa0');S.s(20,14+B,'#ff8fa0');
 if(air&&p.vy<-40){S.r(16,13+B,2,2,'#160c2e')}else{S.s(16,14+B,'#160c2e');S.s(17,14+B,'#160c2e')}
 sprX.putImageData(S.id,0,0);return sprC}

// ---------- particles / fx ----------
const TAUNTS=['Come here!','Wait for me!','Jump!','Stack on me!','Go go go!','Hurry up!','Nice!','Oops…'];const bubbles={},tauntSeq={};
let parts=[],springT={},flash=0,shake=0,camX=0,camY=0,CX=0,CY=0,TT=0,birds=[],intro=0,toast='',toastT=0;
function puff(px,py,n,cols,spd,grav,sz){for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,s=(spd||30)*(0.3+rnd());parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(grav?20:5),life:0.4+rnd()*0.5,col:cols[rnd()*cols.length|0],g:grav||0,sz:sz||(rnd()<0.5?2:1)})}}
let ac=null;
const audioInit=()=>{try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();else if(ac.state==='suspended')ac.resume()}catch(e){}};
function beep(f,d,type,v,slide,delay){if(!ac)return;try{const t=ac.currentTime+(delay||0),o=ac.createOscillator(),gn=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);gn.gain.setValueAtTime(v||0.035,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+d+0.02)}catch(e){}}
const arp=(n,gap,v)=>n.forEach((f,i)=>beep(f,0.14,'square',v||0.03,0,i*gap));
function taunt(slot,i){bubbles[slot]={i,t:2.4};beep(520+(i%8)*60,0.09,'triangle',0.035,1.25)}
function nextTaunt(slot){const q=tauntSeq[slot]||{i:-1,at:0},now=performance.now(),i=now-q.at<1600?(q.i+1)%TAUNTS.length:0;tauntSeq[slot]={i,at:now};return i}
function handleFx(list,g){const th=g?g.theme:0;const dust=[['#f2f6ff','#c8d4f5'],['#c8a070','#8ad050'],['#7a84c8','#3fbf98'],['#ffffff','#e6d4a8'],['#7a6a6e','#ff8a3a']][th];
 for(const [k,fx_,fy,a] of list){const pc=a>=0&&a<PAL.length?PAL[a]:PAL[0];
 switch(k){case 'jump':puff(fx_,fy,6,dust,25);beep(420,0.09,'square',0.022,1.8);break;
 case 'land':puff(fx_,fy,6,dust,22);break;

 let ws;try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws')}catch(e){const el=document.getElementById('err');if(el)el.textContent='Could not reach the server';return}net.ws=ws;

 ws.onclose=()=>{if(net.ws===ws){net.ws=null;if(mode==='online'||screen==='lobby'){game=null;showOnline('Disconnected from the room')}}};

 if(m.t==='pong'){const r=performance.now()-m.c;net.rtt=net.rtt?net.rtt*0.7+r*0.3:r;return}
 if(m.t==='room'){net.code=m.code;net.slot=m.you;net.host=m.host===m.you;net.players=m.players;net.state=m.state;net.level=m.level;net.done=new Set(m.done);
  if(m.state==='lobby'){mode='lobby';game=null;showLobby()}else if(screen==='lobby')closeUI();return}
 if(m.t==='s'){const d=H.unpackSnap(m.d);{const now=performance.now();if(net.lastAt){const dt_=now-net.lastAt;net.iv=net.iv*0.9+dt_*0.1;net.jit=net.jit*0.9+Math.abs(dt_-net.iv)*0.1;net.delay=clamp(net.iv+net.jit*2.5+10,50,220)}net.lastAt=now;net.upsN++}if(!game||game.li!==d.li||game.n!==d.n||mode!=='online'){mode='online';const fresh=!game||game.li!==d.li;game=H.createGame(d.li,d.n);game.players=[];parts=[];net.snaps=[];pr.p=null;pr.world=null;pr.log.length=0;if(fresh)intro=3.2;if(screen==='lobby'||screen==='win')closeUI()}
  handleFx(d.fx||[],game);net.snaps.push({at:performance.now(),d});if(net.snaps.length>12)net.snaps.shift();reconcile(d);
  if(d.S.won&&screen!=='win'&&screen!=='pause'&&d.S.winT>0.6)showWin();if(!d.S.won&&screen==='win')closeUI()}}
function showLobby(){const L=H.LEVELS[net.level];let root;
 const left='<div class="roomc"><p class="sub">ROOM CODE</p><div class="bigcode">'+esc(net.code)+'</div><p class="note">Friends open this page, pick Play online and type the code. Up to 8 can join.</p><div class="plist">'+net.players.map(q=>'<div class="pl" style="--pc:'+PAL[q.slot].H+'"><canvas data-slot="'+q.slot+'" width="24" height="32"></canvas><div><span>'+esc(q.name)+'</span><small>'+PAL[q.slot].n+(q.slot===net.slot?' · you':'')+(q.host?' · host':'')+'</small></div></div>').join('')+'</div>'
  +'<div class="menu" style="align-items:flex-start">'+(net.host?mi('bStart','START LEVEL '+(net.level+1)):'<p class="note">Level '+(net.level+1)+': '+esc(L.name)+'. Waiting for the host to start…</p>')+mi('bLeave','LEAVE ROOM','sm')+'</div></div>';
 root=scrn('lobby',left+pickerHTML(net.level,net.done,net.level),{cls:'lobby',lr:d=>setWorld(root,+root.dataset.w+d),sel:net.host?'#bStart':'#bLeave',
  hints:HNAV+'<span><kbd>←</kbd><kbd>→</kbd> world</span>'+(net.host?'<span>Pick a level, then Start</span>':''),
  init:r=>{bindPicker(r,net.done,li=>{if(net.host)send({t:'pick',level:li})});lvInfo(r,net.level,net.done);r.querySelectorAll('.pl canvas').forEach(c=>c.getContext('2d').drawImage(charSprite({slot:+c.dataset.slot,vx:0,vy:0,grounded:true,row:0,anim:0,blinkT:3},0.3),0,0))},
  on:{bStart:()=>send({t:'start',level:net.level}),bLeave:leaveRoom}})}
let camC=null;

 S.cam=camC.cam;S.camY=camC.camY;S.zoom=camC.zoom;S.zl=camC.zl;S.zHold=camC.zHold;S.camGY=camC.gy;const t=S.t;H.camera(g,Math.min(dt,0.05),camC.snap);S.t=t;camC.snap=false;camC.cam=S.cam;camC.camY=S.camY;camC.zoom=S.zoom;camC.zl=S.zl;camC.zHold=S.zHold;camC.gy=S.camGY}
function interp(){const sn=net.snaps;if(!sn.length)return;const tgt=performance.now()-net.delay;let a=sn[0],b=sn[sn.length-1];
 for(let i=0;i<sn.length-1;i++){if(sn[i].at<=tgt&&sn[i+1].at>=tgt){a=sn[i];b=sn[i+1];break}}
 if(tgt>=b.at)a=b;const al=a===b?1:clamp((tgt-a.at)/(b.at-a.at),0,1),L=(u,v)=>u+(v-u)*al;
 const A=a.d,Bd=b.d;H.applySnapshot(game,Bd);
 const S=Object.assign({},Bd.S);S.cam=L(A.S.cam,Bd.S.cam);S.t=A.S.t<=Bd.S.t?L(A.S.t,Bd.S.t):Bd.S.t;
 const lerpArr=(arrA,arrB,keys)=>arrB.map((o,i)=>{const p=arrA&&arrA[i];if(!p)return o;const c=Object.assign({},o);keys.forEach(k=>c[k]=L(p[k],o[k]));return c});
 S.crates=lerpArr(A.S.crates,Bd.S.crates,['x','y']);S.lifts=lerpArr(A.S.lifts,Bd.S.lifts,['x','y']);S.bridges=lerpArr(A.S.bridges,Bd.S.bridges,['y']);S.rafts=lerpArr(A.S.rafts,Bd.S.rafts,['x']);S.crush=lerpArr(A.S.crush,Bd.S.crush,['y']);
 S.bals=Bd.S.bals.map((bb,i)=>{const pa=A.S.bals[i];if(!pa)return bb;return Object.assign({},bb,{pans:bb.pans.map((pn,j)=>Object.assign({},pn,{y:L(pa.pans[j].y,pn.y)}))})});
 S.key=Object.assign({},Bd.S.key,{x:L(A.S.key.x,Bd.S.key.x),y:L(A.S.key.y,Bd.S.key.y)});S.scroll=L(A.S.scroll||0,Bd.S.scroll||0);game.S=S;
 const moved=[];if(pr.world&&pr.p){const W=pr.world.S;S.crush=S.crush.map((c,i)=>{const w=W.crush[i];if(!w)return c;moved.push([c,0,w.y-c.y]);return Object.assign({},c,{y:w.y})});S.lifts=S.lifts.map((l,i)=>{const w=W.lifts[i];if(!w)return l;moved.push([l,w.x-l.x,w.y-l.y]);return Object.assign({},l,{x:w.x,y:w.y})})}
 for(const p of game.players){const pa=A.P.find(q=>q.slot===p.slot);if(pa&&Math.abs(pa.x-p.x)<40){p.x=L(pa.x,p.x);p.y=L(pa.y,p.y)}}
 for(const p of game.players){if(p.slot===net.slot||p.dead||p.inside)continue;for(const [o,dx,dy] of moved)if(Math.abs(p.y+p.h-o.y)<2.5&&p.x+p.w>o.x&&p.x<o.x+o.w){p.x+=dx;p.y+=dy;break}}
 if(pr.p){const me=game.players.find(p=>p.slot===net.slot);if(me&&!me.dead&&!me.inside)Object.assign(me,{x:pr.p.x+pr.off.x,y:pr.p.y+pr.off.y,vx:pr.p.vx,vy:pr.p.vy,face:pr.p.face,grounded:pr.p.grounded,squash:pr.p.squash,anim:pr.p.anim,row:pr.p.row})}}

function resize(){DPR=LOWQ?1:Math.min(2,window.devicePixelRatio||1);const cw=Math.max(240,innerWidth),ch=Math.max(160,innerHeight);scr.width=Math.round(cw*DPR);scr.height=Math.round(ch*DPR);
 const asp=cw/ch;if(asp>=VW/VH){VHv=VH;VWv=Math.min(VH*asp,VH*3.6)}else{VWv=VW;VHv=VW/asp}
 BW=Math.ceil(VWv*2);BH=Math.ceil(VHv*2);BGS=Math.min(1,360/(VHv*2));bgC.width=Math.ceil(VWv*2*BGS)+1;bgC.height=360;scene.width=BW*2+8;scene.height=BH*2+8;
 vig.width=scr.width;vig.height=scr.height;const v=vig.getContext('2d'),W=vig.width,Hh=vig.height,gd=v.createRadialGradient(W/2,Hh/2,Math.min(W,Hh)*0.38,W/2,Hh/2,Math.hypot(W,Hh)*0.56);gd.addColorStop(0,'rgba(6,3,16,0)');gd.addColorStop(1,'rgba(6,3,16,0.38)');v.fillStyle=gd;v.fillRect(0,0,W,Hh)}
addEventListener('resize',resize);resize();

function toggleFS(){try{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen({navigationUI:'hide'});if(p&&p.catch)p.catch(()=>{})}catch(e){}}
let last=performance.now(),acc=0,pingT=0,fpsEMA=60,slowF=0,showNet=false;
function frame(now){const dt=Math.min(0.1,(now-last)/1000);last=now;TT+=dt;
 shake=Math.max(0,shake-dt);for(const s in bubbles)bubbles[s].t-=dt;flash=Math.max(0,flash-dt);intro=Math.max(0,intro-dt);toastT=Math.max(0,toastT-dt);for(const k in springT)springT[k]-=dt;
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.vx*=1-dt*2;q.life-=dt}parts=parts.filter(q=>q.life>0);if(parts.length>700)parts.splice(0,parts.length-700);
 let g=null;
 if(mode==='local'&&game){g=game;
  for(let id=0;id<8;id++){const r=readScheme(id);if(!r)continue;const slot=localSchemes.indexOf(id);
   if(slot>=0){const p=g.players.find(q=>q.slot===slot);if(r.tp&&!screen)taunt(slot,nextTaunt(slot));if(p){const blocked=!!screen;if(r.jp&&!blocked)p.input.jumpP=true;if(r.d&&!p.input.down&&!blocked)p.input.downP=true;p.input.x=blocked?0:r.x;p.input.jump=!blocked&&r.j;p.input.down=r.d}}
   else if(r.jp&&!screen&&!g.S.won){const fr=[0,1,2,3,4,5,6,7].find(s=>localSchemes[s]==null);if(fr!=null){localSchemes[fr]=id;H.addPlayer(g,fr)}}}
  if(screen!=='pause'){acc+=dt;while(acc>=H.STEP){H.step(g,H.STEP);H.clearEdges(g);acc-=H.STEP}}else acc=0;
  handleFx(g.fx.splice(0),g);if(g.S.won&&g.S.winT>0.6&&screen!=='win')showWin()}
 else if(mode==='online'&&game){g=game;pingT-=dt;if(pingT<=0){pingT=2;send({t:'ping',c:performance.now()})}for(const p of game.players){if(p.blinkT==null)p.blinkT=3;p.blinkT-=dt;if(p.blinkT<0)p.blinkT=2+Math.random()*3}const inp=screen==='pause'?{x:0,j:false,d:false}:onlineInput();
  if(!pr.last||inp.x!==pr.last.x||inp.j!==pr.last.j||inp.d!==pr.last.d){pr.q++;pr.k=0;if(inp.j&&!(pr.last&&pr.last.j))pr.jp=true;if(inp.d&&!(pr.last&&pr.last.d))pr.dp=true;pr.last=inp;send({t:'in',x:inp.x,j:inp.j,d:inp.d,q:pr.q})}
  pr.acc+=dt;let ns=0;while(pr.acc>=H.STEP&&ns<14){const e={q:pr.q,k:pr.k++,x:inp.x,j:inp.j,jp:pr.jp,d:inp.d,dp:pr.dp};pr.jp=pr.dp=false;pr.log.push(e);if(pr.log.length>720)pr.log.shift();if(pr.p&&pr.world)simEntry(pr.world,pr.p,e);pr.acc-=H.STEP;ns++}if(ns>=14)pr.acc=0;
  const dec=Math.exp(-dt*10);pr.off.x*=dec;pr.off.y*=dec;interp();clientCam(game,dt)}
 else if(demoPin>=0){if(demo.li!==demoPin&&performance.now()>=demoPinAt){demo=H.createGame(demoPin);demoT=0}demoT+=dt;g=demo;demo.S.t+=dt;demo.S.cam=(0.5-0.5*Math.cos(demoT*0.16))*Math.max(0,demo.LW-VWv);demo.S.camY=(0.5+0.5*Math.cos(demoT*0.21))*Math.max(0,demo.LH-VHv)}
 else{demoT+=dt;if(demoT>9){demoT=0;demoW=(demoW+1)%5;demo=H.createGame(demoW*5+(demoW===0?0:1))}g=demo;demo.S.t+=dt;demo.S.cam=(Math.sin(demoT*0.12-1.2)*0.5+0.5)*Math.min(demo.LW-VW,700)}
 padMenu(dt);if(screen==='title')drawCrew(dt);
 fpsEMA=fpsEMA*0.95+(dt>0?1/dt:60)*0.05;if(!LOWQ&&g!==demo){slowF=fpsEMA<42?slowF+dt:0;if(slowF>3)setLowQ(true,'Switched to fast graphics to keep things smooth (G to change)')}
 const d0=performance.now();draw(g,dt);const dd=performance.now()-d0;drawEMA=drawEMA*0.95+dd*0.05;if(!LOWQ){slowN=drawEMA>13?slowN+1:0;if(slowN>120)setLowQ(true,'Switched to fast graphics to keep things smooth (G to change)')}hit.clear();requestAnimationFrame(frame)}
