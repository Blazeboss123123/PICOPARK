<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huddle Peak</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: playful co-op arcade, cosy and chaotic
   IDEA: the whole window is the game; five painted worlds on the climb to the peak
   PICTURE: full-bleed pixel-art scene with menus floating over it
   COLOUR and TYPE: deep dusk purple panels, gold accent; Press Start 2P for labels
   LAYOUT: canvas fills the viewport; panels centred; controls shown only in menus */
:root{color-scheme:dark;--bg:#120a26;--panel:#1c1138;--ink:#efeaff;--mut:#a99dd4;--line:#34245e;--teal:#2ec4b6;--gold:#ffd23f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#05030c;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#screen{position:fixed;inset:0;width:100vw;height:100vh;display:block;outline:none;touch-action:none}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px 16px 64px;pointer-events:none}
#ui:empty{display:none}
.panel{pointer-events:auto;background:rgba(14,8,30,.9);border:2px solid #3d2a70;border-radius:12px;padding:clamp(14px,2.4vw,26px);width:min(800px,100%);max-height:100%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 18px 60px rgba(0,0,0,.45)}
.panel h2{font:400 clamp(18px,3.4vw,30px)/1.3 "Press Start 2P",monospace;margin:0;color:#fff;text-shadow:0 3px 0 #3d2a70}
.panel h3{font:400 12px/1.5 "Press Start 2P",monospace;margin:0;color:var(--gold)}
.panel p{margin:0;color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%}
button{font:400 12px/1.4 "Press Start 2P",monospace;color:#120a26;background:var(--gold);border:0;border-bottom:4px solid #b88a1a;border-radius:8px;padding:12px 16px;min-height:44px;cursor:pointer}
button:hover{filter:brightness(1.08)}button:active{transform:translateY(2px);border-bottom-width:2px}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
button.alt{background:#2a1c50;color:var(--ink);border-bottom-color:#160c2e}
button.teal{background:var(--teal);border-bottom-color:#1a8a80}
button:disabled{opacity:.5;cursor:default;filter:none}
input{font:16px system-ui,sans-serif;color:var(--ink);background:#0d0820;border:2px solid #45327a;border-radius:8px;padding:10px 12px;min-height:44px;width:min(260px,100%)}
input:focus{outline:none;border-color:var(--teal)}
input.code{font:400 16px "Press Start 2P",monospace;text-transform:uppercase;letter-spacing:4px;text-align:center;width:150px}
.worlds{display:flex;flex-direction:column;gap:8px;width:100%}
.world{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;align-items:stretch}
.world h4{margin:0;font:400 10px/1.5 "Press Start 2P",monospace;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:8px;padding:6px;color:#fff}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lv{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#22164a;color:var(--ink);border-bottom-color:#130b2c;padding:6px 8px;min-height:44px;font-size:10px}
.lv b{font-size:13px;color:var(--gold);font-weight:400}.lv span{font:12px/1.25 system-ui,sans-serif;color:var(--mut)}
.lv.done{background:#163c45}.lv.sel{outline:3px solid var(--teal)}
@media(max-width:620px){.world{grid-template-columns:1fr}.levels{grid-template-columns:repeat(3,minmax(0,1fr))}}
.plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;width:100%}
.pl{display:flex;align-items:center;gap:8px;background:#22164a;border-radius:8px;padding:8px 10px;text-align:left}
.pl i{width:18px;height:18px;border-radius:4px;flex:none}.pl small{color:var(--mut)}
.bigcode{font:400 clamp(22px,5vw,34px)/1 "Press Start 2P",monospace;color:var(--gold);letter-spacing:6px}
.err{color:#ff8f8f;font-size:14px;min-height:1em}
.keys{position:fixed;left:0;right:0;bottom:0;display:none;flex-wrap:wrap;gap:4px 16px;justify-content:center;color:#c9c0ea;font-size:12px;padding:10px 12px;background:linear-gradient(transparent,rgba(8,4,20,.85));pointer-events:none}
body.menu .keys{display:flex}
.keys span{white-space:nowrap}.keys i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
kbd{font:inherit;font-size:11px;color:#e6e0ff;background:#1c1338;border:1px solid #3e2e70;border-radius:4px;padding:0 4px}
</style></head><body>
<canvas id="screen" tabindex="0" aria-label="Huddle Peak game screen"></canvas><div id="ui"></div>
<div class="keys" id="keys">
<span><i style="background:#e8833a"></i>P1 <kbd>A</kbd><kbd>D</kbd> move <kbd>W</kbd> jump <kbd>S</kbd> door/pass</span>
<span><i style="background:#2ec4b6"></i>P2 <kbd>←</kbd><kbd>→</kbd> <kbd>↑</kbd> jump <kbd>↓</kbd> door/pass</span>
<span><i style="background:#e85a8a"></i>P3 <kbd>J</kbd><kbd>L</kbd> <kbd>I</kbd> jump <kbd>K</kbd></span>
<span><i style="background:#f2c53a"></i>P4 Numpad <kbd>4</kbd><kbd>6</kbd> <kbd>8</kbd> jump <kbd>5</kbd></span>
<span>Gamepad: stick, <kbd>A</kbd> jump, <kbd>B</kbd> door · <kbd>Esc</kbd> menu · <kbd>F</kbd> fullscreen</span>
</div>
<script src="game.js"></script>
<script src="art.js"></script>
<script>
{
const H=window.HP,TS=H.TS,VW=H.VW,VH=H.VH,ROWS=H.ROWS;
const ONLINE_OK=!window.HP_STANDALONE&&/^https?:$/.test(location.protocol);
const scr=document.getElementById('screen'),sctx=scr.getContext('2d'),ui=document.getElementById('ui');
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rs=7;const rnd=()=>(rs=(rs*16807)%2147483647)/2147483647;

// ---------- art module and view ----------
const ART=window.HPArt,{PB,pk,rgb,mixh,h1,h2,vn,fbm,vn2,bay,buildBG,buildWorld}=ART;
let BW=640,BH=360,VWv=VW,VHv=VH,DPR=1,VZW=VW,VZH=VH,HDX=0,BGS=1,LOWQ=false,drawEMA=0,slowN=0;
const bgC=mk(BW,BH),bgX=bgC.getContext('2d'),scene=mk(BW*2+8,BH*2+8),sceneX=scene.getContext('2d'),up=mk(8,8),upX=up.getContext('2d'),vig=mk(8,8);let x=sceneX;

// ---------- characters ----------
const PAL=[{H:'#e8833a',h:'#ffb46a',d:'#b0582a',S:'#2ec4b6',s:'#1a8a80',n:'Orange'},{H:'#2ec4b6',h:'#8ff5e8',d:'#1a8a80',S:'#ffcf4a',s:'#c99a1e',n:'Teal'},{H:'#e85a8a',h:'#ff9ec0',d:'#a83862',S:'#f5f8ff',s:'#b8c6ee',n:'Pink'},{H:'#f2c53a',h:'#fff09a',d:'#b88a1a',S:'#e8505a',s:'#a83038',n:'Yellow'}];
PAL.forEach(p=>{p.hh=mixh(p.h,'#ffffff',0.55);p.dd=mixh(p.d,'#1a0f24',0.35)});
const SPR=PB(24,32),sprC=mk(24,32),sprX=sprC.getContext('2d');
const MASK=new Uint8Array(24*32);
{const cx=12,cy=12.6,rx=9.4,ry=9.0;for(let y=0;y<32;y++)for(let xx=0;xx<24;xx++){const nx=(xx+0.5-cx)/rx,ny=(y+0.5-cy)/ry;if(nx*nx+ny*ny<=1)MASK[y*24+xx]=1}[[11,3],[12,2],[12,3],[13,2],[13,1],[14,1],[14,0]].forEach(([a,b])=>MASK[b*24+a]=1)}
function charSprite(p,t){const P=PAL[p.slot],S=SPR;S.u.fill(0);const K='#1a0f24';
 const moving=Math.abs(p.vx)>12&&p.grounded,air=!p.grounded,rowing=p.row>0,ph=p.anim*9;
 const bob=(!moving&&!air&&Math.floor(t*2.2+p.slot)%2)?1:0;
 const leg=(lx,dx,lift)=>{for(let y=20;y<=26-lift;y++){const k=(y-20)/6,ox=Math.round(dx*k);S.s(lx-1+ox,y,K);S.s(lx+ox,y,P.d);S.s(lx+1+ox,y,P.dd);S.s(lx+2+ox,y,K)}const fy=27-lift,fx=lx-1+dx;S.r(fx,fy,6,3,K);S.r(fx+1,fy+1,4,1,'#2a1a2e');S.s(fx+1,fy+1,'#5a4a5e');S.s(fx+4,fy+1,'#3a2a3e')};
 if(air){leg(7,-1,p.vy<0?2:1);leg(14,1,p.vy<0?2:0)}
 else if(moving||rowing){const a=Math.sin(ph),b=Math.sin(ph+Math.PI);leg(7,Math.round(a*2.5),a>0.3?Math.round(a*2):0);leg(14,Math.round(b*2.5),b>0.3?Math.round(b*2):0)}
 else{leg(7,0,0);leg(14,0,0)}
 for(let y=0;y<24;y++)for(let xx=0;xx<24;xx++){if(!MASK[y*24+xx])continue;const yy=y+bob,edge=!MASK[(y-1)*24+xx]||!MASK[(y+1)*24+xx]||!MASK[y*24+xx-1]||!MASK[y*24+xx+1];if(edge){S.s(xx,yy,K);continue}const nx=(xx+0.5-12)/9.4,ny=(y+0.5-12.6)/9;const l=-(nx*0.55+ny*0.8);S.s(xx,yy,l>0.62?P.hh:l>0.32?P.h:l<-0.5?P.dd:l<-0.22?P.d:P.H)}
 const B=bob;S.s(7,6+B,P.hh);S.s(8,6+B,P.hh);S.s(7,7+B,P.hh);
 for(let xx=3;xx<=20;xx++)for(let y=16;y<=18;y++){if(!MASK[y*24+xx]||!MASK[y*24+xx-1]||!MASK[y*24+xx+1])continue;S.s(xx,y+B,y===18||(xx%5===0)?P.s:P.S)}
 S.r(17,16+B,3,4,P.S);S.s(19,19+B,P.s);S.s(17,19+B,K);S.s(20,17+B,K);
 const tw=moving||air||rowing?Math.sin(t*14+p.slot):Math.sin(t*3+p.slot)*0.4;for(let i=0;i<5;i++){const tx=3-i,ty=Math.round(17+i*0.5+tw*(i*0.45));S.s(tx,ty+B,P.S);S.s(tx,ty+1+B,i%2?P.s:P.S)}
 const blink=p.blinkT<0.13;
 for(const ex of [13,17]){if(blink){S.r(ex,11+B,3,1,'#160c2e');continue}S.r(ex,9+B,3,4,'#ffffff');S.r(ex+1,10+B,2,3,'#160c2e');S.s(ex+1,10+B,'#ffffff');S.s(ex,9+B,'#e8e6f8')}
 S.s(12,14+B,'#ff8fa0');S.s(13,14+B,'#ff8fa0');S.s(20,14+B,'#ff8fa0');
 if(air&&p.vy<-40){S.r(16,13+B,2,2,'#160c2e')}else{S.s(16,14+B,'#160c2e');S.s(17,14+B,'#160c2e')}
 sprX.putImageData(S.id,0,0);return sprC}

// ---------- particles / fx ----------
let parts=[],springT={},flash=0,shake=0,camX=0,camY=0,CX=0,CY=0,TT=0,birds=[],intro=0,toast='',toastT=0;
function puff(px,py,n,cols,spd,grav,sz){for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,s=(spd||30)*(0.3+rnd());parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(grav?20:5),life:0.4+rnd()*0.5,col:cols[rnd()*cols.length|0],g:grav||0,sz:sz||(rnd()<0.5?2:1)})}}
let ac=null;
const audioInit=()=>{try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();else if(ac.state==='suspended')ac.resume()}catch(e){}};
function beep(f,d,type,v,slide,delay){if(!ac)return;try{const t=ac.currentTime+(delay||0),o=ac.createOscillator(),gn=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);gn.gain.setValueAtTime(v||0.035,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+d+0.02)}catch(e){}}
const arp=(n,gap,v)=>n.forEach((f,i)=>beep(f,0.14,'square',v||0.03,0,i*gap));
function handleFx(list,g){const th=g?g.theme:0;const dust=[['#f2f6ff','#c8d4f5'],['#c8a070','#8ad050'],['#7a84c8','#3fbf98'],['#ffffff','#e6d4a8'],['#7a6a6e','#ff8a3a']][th];
 for(const [k,fx_,fy,a] of list){const pc=a>=0&&a<4?PAL[a]:PAL[0];
 switch(k){case 'jump':puff(fx_,fy,6,dust,25);beep(420,0.09,'square',0.022,1.8);break;
 case 'land':puff(fx_,fy,6,dust,22);break;
 case 'die':puff(fx_,fy,30,[pc.H,pc.h,pc.S,'#ffffff'],85,300);shake=0.3;beep(220,0.32,'sawtooth',0.04,0.35);break;
 case 'key':puff(fx_,fy,16,['#ffd23f','#fff3a0'],40);arp([784,988,1175],0.05);break;
 case 'pass':puff(fx_,fy,14,['#ffd23f','#ffffff',pc.H],40);arp([660,880],0.06);break;
 case 'door':puff(fx_,fy,28,['#ffd23f','#ffffff','#ffb46a'],60);flash=0.3;arp([523,659,784,1047],0.07);break;
 case 'enter':puff(fx_,fy,12,[pc.H,'#ffffff'],30);beep(880,0.12,'square',0.03,1.5);break;
 case 'lever':puff(fx_,fy,14,['#7ff0e0','#ffffff'],40);shake=0.15;arp([330,440,554,659],0.06);break;
 case 'plate':beep(a?660:440,0.07,'square',0.025);break;
 case 'latch':arp([392,523,659,784],0.07);flash=0.15;break;
 case 'strain':beep(150,0.08,'square',0.02,0.7);break;
 case 'spring':springT[fx_+','+fy]=0.25;puff(fx_,fy,8,['#ffffff','#ffd23f'],40);beep(300,0.2,'triangle',0.05,3);break;
 case 'crumble':beep(180,0.06,'square',0.02,0.8);break;
 case 'crumbfall':puff(fx_,fy,12,dust.concat(['#ffffff']),30,200);beep(140,0.12,'triangle',0.04,0.6);break;
 case 'crack':beep(200,0.08,'sawtooth',0.03,0.7);break;
 case 'break':puff(fx_,fy,16,['#a06a3a','#7a4a2a','#ffffff'],40,250);shake=0.2;beep(110,0.25,'sawtooth',0.04,0.5);break;
 case 'thud':puff(fx_,fy,14,dust.concat(['#8a5a32']),50);shake=0.25;beep(110,0.25,'triangle',0.07,0.5);break;
 case 'slam':puff(fx_,fy,16,dust.concat(['#ffffff']),70);shake=0.3;beep(90,0.2,'square',0.06,0.5);break;
 case 'scrape':puff(fx_,fy,1,dust,12);break;
 case 'flip':beep(a?520:390,0.08,'square',0.03);flash=Math.max(flash,0.05);break;
 case 'torch':puff(fx_,fy,16,['#ffd060','#ff8a2a','#ffffff'],40);arp([523,784],0.05);break;
 case 'wind':break;
 case 'light':if(a===1)beep(520,0.15,'square',0.03);if(a===2)beep(260,0.35,'square',0.045,0.8);if(a===0)beep(660,0.12,'square',0.03,1.3);break;
 case 'restart':if(!(g&&g.flags.dark))flash=0.35;break;
 case 'win':arp([523,659,784,1047,784,1047,1319],0.11,0.035);flash=0.4;if(g){const z=g.S.zoom||1;for(let i=0;i<120;i++)parts.push({x:camX+rnd()*VZW,y:camY-4-rnd()*30,vx:(rnd()-0.5)*40,vy:20+rnd()*50,life:2.5+rnd()*2,col:['#e8833a','#2ec4b6','#e85a8a','#f2c53a','#ffffff','#ffd23f'][rnd()*6|0],g:40,sz:2})}break;
 case 'adapt':toast='Puzzle set for '+a+' players';toastT=3.2;intro=Math.max(intro,2.6);flash=Math.max(flash,0.12);break;
 case 'join':puff(fx_,fy,14,[pc.H,pc.h,'#ffffff'],40);arp([523,659,784],0.06);break}}}

// ---------- drawing helpers ----------
const F=(a,b,w,h,c)=>{x.fillStyle=c;x.fillRect(a,b,w,h)};
const BX=wx=>Math.round(wx*2)-CX,BY=wy=>Math.round(wy*2)-CY;
const SIGC={a:['#2ec4b6','#8ff5e8','#1a6a64'],b:['#ffb02e','#ffe08a','#8a5a10'],c:['#e85a8a','#ff9ec0','#7a2a48'],d:['#9be04a','#d6ff9a','#4a7a1a'],e:['#a98bff','#d9ccff','#4a3a8a']};
const DIG=['111101101101111','010110010010111','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001010010010','111101111101111','111101111001111'];
function digit(n,px,py,s,c){const d=DIG[n]||DIG[0];for(let i=0;i<15;i++)if(d[i]==='1')F(px+(i%3)*s,py+Math.floor(i/3)*s,s,s,c)}
function line2(x0,y0,x1,y1,c,w){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))|0;for(let i=0;i<=n;i++){const t=n?i/n:0;F(Math.round(x0+(x1-x0)*t),Math.round(y0+(y1-y0)*t),w||2,w||2,c)}}
const KEYP=[".kkk..........","kyyyk.........","kyYykkkkkkkkk.","ky.ykyyyyyyyyk","kyyykkkyykyyk.",".kkk...kk.kk.."];
function drawKey(cx_,cy_){const ox=cx_-7,oy=cy_-3;KEYP.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch==='.')return;F(ox+i,oy+j,1,1,ch==='k'?'#5a3a08':ch==='Y'?'#fff6c0':'#ffd23f')}));F(ox+1,oy+2,1,1,'#fff6c0');F(ox+5,oy+3,7,1,'#ffe68a')}

function drawTiles(g){const S=g.S,gr=g.grid,th=g.theme,z=S.zoom||1,t0=Math.max(0,Math.floor(camX/TS)-1),t1=Math.min(g.W-1,Math.floor((camX+VZW)/TS)+1),r0=Math.max(0,Math.floor(camY/TS)-1),r1=Math.min(g.H-1,Math.floor((camY+VZH)/TS)+1);
 for(let ty=r0;ty<=r1;ty++)for(let tx=t0;tx<=t1;tx++){const ch=gr[ty][tx];if(ch==='.'||ch==='#')continue;const ox=BX(tx*TS),oy=BY(ty*TS);
  if(ch>='a'&&ch<='e'){const sg=S.sig[ch],[c1,c2,c3]=SIGC[ch];if(sg.show<0.02){if(Math.floor(S.t*2)%2)for(let i=0;i<20;i+=4){F(ox+i,oy,2,1,c1);F(ox+i,oy+19,2,1,c1);F(ox,oy+i,1,2,c1);F(ox+19,oy+i,1,2,c1)}}
   else{const h=Math.max(1,Math.round(20*sg.show)),y0=oy+20-h;F(ox,y0,20,h,'#1a3a60');F(ox+1,y0+1,18,Math.max(0,h-2),'#8fd3f0');F(ox+2,y0+1,16,1,'#e6f8ff');F(ox+1,y0+2,1,Math.max(0,h-4),'#c4ecff');F(ox+17,y0+2,1,Math.max(0,h-3),'#5aa8d0');if(h>8){line2(ox+5,y0+4,ox+9,y0+8,'#e6f8ff',1);F(ox+4,y0+h-4,12,2,c1)}}}

  if(m.state==='lobby'){mode='lobby';game=null;showLobby()}else if(screen==='lobby')closeUI();return}

  handleFx(d.fx||[],game);net.snaps.push({at:performance.now(),d});if(net.snaps.length>12)net.snaps.shift();reconcile(d);
  if(d.S.won&&screen!=='win'&&screen!=='pause'&&d.S.winT>0.6)showWin();if(!d.S.won&&screen==='win')closeUI()}}

  +'<div class="row">'+(net.host?'<button id="bStart">Start '+(net.level+1)+': '+esc(L.name)+'</button>':'<p>Level '+(net.level+1)+': '+esc(L.name)+'. Waiting for the host to start…</p>')+'<button class="alt" id="bLeave">Leave</button></div>'

 for(const p of game.players){const pa=A.P.find(q=>q.slot===p.slot);if(pa&&Math.abs(pa.x-p.x)<40){p.x=L(pa.x,p.x);p.y=L(pa.y,p.y)}}
 if(pr.p){const me=game.players.find(p=>p.slot===net.slot);if(me&&!me.dead&&!me.inside)Object.assign(me,{x:pr.p.x+pr.off.x,y:pr.p.y+pr.off.y,vx:pr.p.vx,vy:pr.p.vy,face:pr.p.face,grounded:pr.p.grounded,squash:pr.p.squash,anim:pr.p.anim,row:pr.p.row})}}

function resize(){DPR=Math.min(2,window.devicePixelRatio||1);const cw=Math.max(240,innerWidth),ch=Math.max(160,innerHeight);scr.width=Math.round(cw*DPR);scr.height=Math.round(ch*DPR);

 vig.width=scr.width;vig.height=scr.height;const v=vig.getContext('2d'),W=vig.width,Hh=vig.height,gd=v.createRadialGradient(W/2,Hh/2,Math.min(W,Hh)*0.38,W/2,Hh/2,Math.hypot(W,Hh)*0.56);gd.addColorStop(0,'rgba(6,3,16,0)');gd.addColorStop(1,'rgba(6,3,16,0.38)');v.fillStyle=gd;v.fillRect(0,0,W,Hh)}

let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(0.1,(now-last)/1000);last=now;TT+=dt;

  for(let id=0;id<8;id++){const r=readScheme(id);if(!r)continue;const slot=localSchemes.indexOf(id);
   if(slot>=0){const p=g.players.find(q=>q.slot===slot);if(p){const blocked=!!screen;if(r.jp&&!blocked)p.input.jumpP=true;if(r.d&&!p.input.down&&!blocked)p.input.downP=true;p.input.x=blocked?0:r.x;p.input.jump=!blocked&&r.j;p.input.down=r.d}}
   else if(r.jp&&!screen&&!g.S.won){const fr=[0,1,2,3].find(s=>localSchemes[s]==null);if(fr!=null){localSchemes[fr]=id;H.addPlayer(g,fr)}}}
  if(screen!=='pause'){acc+=dt;while(acc>=H.STEP){H.step(g,H.STEP);H.clearEdges(g);acc-=H.STEP}}else acc=0;
  handleFx(g.fx.splice(0),g);if(g.S.won&&g.S.winT>0.6&&screen!=='win')showWin()}
 else if(mode==='online'&&game){g=game;const inp=screen==='pause'?{x:0,j:false,d:false}:onlineInput();
  if(!pr.last||inp.x!==pr.last.x||inp.j!==pr.last.j||inp.d!==pr.last.d){pr.q++;pr.k=0;if(inp.j&&!(pr.last&&pr.last.j))pr.jp=true;if(inp.d&&!(pr.last&&pr.last.d))pr.dp=true;pr.last=inp;send({t:'in',x:inp.x,j:inp.j,d:inp.d,q:pr.q})}
  pr.acc+=dt;let ns=0;while(pr.acc>=H.STEP&&ns<14){const e={q:pr.q,k:pr.k++,x:inp.x,j:inp.j,jp:pr.jp,d:inp.d,dp:pr.dp};pr.jp=pr.dp=false;pr.log.push(e);if(pr.log.length>720)pr.log.shift();if(pr.p&&pr.world)simEntry(pr.world,pr.p,e);pr.acc-=H.STEP;ns++}if(ns>=14)pr.acc=0;
  const dec=Math.exp(-dt*10);pr.off.x*=dec;pr.off.y*=dec;interp()}
 else{demoT+=dt;if(demoT>9){demoT=0;demoW=(demoW+1)%5;demo=H.createGame(demoW*5+(demoW===0?0:1))}g=demo;demo.S.t+=dt;demo.S.cam=(Math.sin(demoT*0.12-1.2)*0.5+0.5)*Math.min(demo.LW-VW,700)}
