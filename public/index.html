<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huddle Peak</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: playful co-op arcade, cosy and chaotic
   IDEA: a handheld arcade screen; five painted worlds on the climb to the peak
   PICTURE: the game canvas itself, large and crisp, with menus inside it
   COLOUR and TYPE: deep dusk purple frame, gold accent; Press Start 2P for labels
   LAYOUT: thin title row, canvas, one quiet row of controls */
:root{color-scheme:dark;--bg:#120a26;--panel:#1c1138;--ink:#efeaff;--mut:#a99dd4;--line:#34245e;--teal:#2ec4b6;--gold:#ffd23f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
main{max-width:1400px;margin:0 auto;padding:10px max(2vw,10px) 16px;display:flex;flex-direction:column;gap:8px}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 16px}
h1{font:400 16px/1.3 "Press Start 2P",monospace;margin:0;color:#fff}
header p{margin:0;color:var(--mut);font-size:14px}
#stage{position:relative;display:flex;justify-content:center}
#wrap{position:relative}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:6px;outline:3px solid #2a1a50}
#screen:focus-visible{outline-color:var(--teal)}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;pointer-events:none}
#ui:empty{display:none}
.panel{pointer-events:auto;background:rgba(14,8,30,.92);border:2px solid #3d2a70;border-radius:10px;padding:clamp(12px,2.2vw,22px);width:min(780px,100%);max-height:100%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.panel h2{font:400 clamp(16px,3vw,26px)/1.3 "Press Start 2P",monospace;margin:0;color:#fff}
.panel h3{font:400 12px/1.5 "Press Start 2P",monospace;margin:0;color:var(--gold)}
.panel p{margin:0;color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%}
button{font:400 12px/1.4 "Press Start 2P",monospace;color:#120a26;background:var(--gold);border:0;border-bottom:4px solid #b88a1a;border-radius:8px;padding:12px 16px;min-height:44px;cursor:pointer}
button:hover{filter:brightness(1.08)}button:active{transform:translateY(2px);border-bottom-width:2px}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
button.alt{background:#2a1c50;color:var(--ink);border-bottom-color:#160c2e}
button.teal{background:var(--teal);border-bottom-color:#1a8a80}
button:disabled{opacity:.5;cursor:default;filter:none}
input{font:16px system-ui,sans-serif;color:var(--ink);background:#0d0820;border:2px solid #45327a;border-radius:8px;padding:10px 12px;min-height:44px;width:min(260px,100%)}
input:focus{outline:none;border-color:var(--teal)}
input.code{font:400 16px "Press Start 2P",monospace;text-transform:uppercase;letter-spacing:4px;text-align:center;width:150px}
.worlds{display:flex;flex-direction:column;gap:8px;width:100%}
.world{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;align-items:stretch}
.world h4{margin:0;font:400 10px/1.5 "Press Start 2P",monospace;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:8px;padding:6px;color:#fff}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lv{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#22164a;color:var(--ink);border-bottom-color:#130b2c;padding:6px 8px;min-height:44px;font-size:10px}
.lv b{font-size:13px;color:var(--gold);font-weight:400}.lv span{font:12px/1.25 system-ui,sans-serif;color:var(--mut)}
.lv.done{background:#163c45}.lv.sel{outline:3px solid var(--teal)}
@media(max-width:620px){.world{grid-template-columns:1fr}.levels{grid-template-columns:repeat(3,minmax(0,1fr))}}
.plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;width:100%}
.pl{display:flex;align-items:center;gap:8px;background:#22164a;border-radius:8px;padding:8px 10px;text-align:left}
.pl i{width:18px;height:18px;border-radius:4px;flex:none}.pl small{color:var(--mut)}
.bigcode{font:400 clamp(22px,5vw,34px)/1 "Press Start 2P",monospace;color:var(--gold);letter-spacing:6px}
.err{color:#ff8f8f;font-size:14px;min-height:1em}
.keys{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;color:#7d72a8;font-size:12px}
.keys span{white-space:nowrap}.keys i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
kbd{font:inherit;font-size:11px;color:#c9c0ea;background:#1c1338;border:1px solid #2e2256;border-radius:4px;padding:0 4px}
</style></head><body>
<main>
<header><h1>Huddle Peak</h1><p>A co-op climb for 2 to 4 friends. Nobody gets to the top alone.</p></header>
<div id="stage"><div id="wrap"><canvas id="screen" tabindex="0" aria-label="Huddle Peak game screen"></canvas><div id="ui"></div></div></div>
<div class="keys" id="keys">
<span><i style="background:#e8833a"></i>P1 <kbd>A</kbd><kbd>D</kbd> move <kbd>W</kbd> jump <kbd>S</kbd> door/pass</span>
<span><i style="background:#2ec4b6"></i>P2 <kbd>←</kbd><kbd>→</kbd> <kbd>↑</kbd> jump <kbd>↓</kbd> door/pass</span>
<span><i style="background:#e85a8a"></i>P3 <kbd>J</kbd><kbd>L</kbd> <kbd>I</kbd> jump <kbd>K</kbd></span>
<span><i style="background:#f2c53a"></i>P4 Numpad <kbd>4</kbd><kbd>6</kbd> <kbd>8</kbd> jump <kbd>5</kbd></span>
<span>Gamepad: stick, <kbd>A</kbd> jump, <kbd>B</kbd> door · <kbd>Esc</kbd> menu</span>
</div>
</main>
<script src="game.js"></script>
<script>
{
const H=window.HP,TS=H.TS,VW=H.VW,VH=H.VH,ROWS=H.ROWS,BW=640,BH=360;

 b(a,b,c,al){a|=0;b|=0;if(a<0||b<0||a>=w||b>=h||al<=0)return;const k=b*w+a,o=u[k],C=rgb(c),oa=o>>>24;if(!oa){u[k]=((Math.round(Math.min(1,al)*255)<<24)|(C[2]<<16)|(C[1]<<8)|C[0])>>>0;return}al=Math.min(1,al);const or=o&255,og=(o>>8)&255,ob=(o>>16)&255;u[k]=((oa<<24)|(Math.round(ob+(C[2]-ob)*al)<<16)|(Math.round(og+(C[1]-og)*al)<<8)|Math.round(or+(C[0]-or)*al))>>>0},

const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5],bay=(a,b)=>(BAY[(b&3)*4+(a&3)]+.5)/16;

const MAXW=Math.max(...H.LEVELS.map((L,i)=>H.createGame(i).LW))*2*2;

 const sl=base-amp*0.5;for(let xx=0;xx<pb.w;xx++){const t=Math.round(h[xx]),fc=h[xx+1]>h[xx]+0.15,bk=h[xx+1]<h[xx]-0.15;for(let y=Math.max(0,t);y<pb.h;y++){const dy=y-t;let c=col;if(fc&&dy<46)c=lit;else if(bk&&dy<34)c=shd;

 if(th===0){
  gradient(sky,[[0,'#0c0720'],[60,'#150c30'],[120,'#22124a'],[170,'#381c60'],[210,'#572872'],[238,'#843c7e'],[260,'#b0507e'],[282,'#d87272'],[304,'#f09a6c'],[360,'#f8b47a']]);
  for(let i=0;i<240;i++){const sx=rnd()*BW|0,sy=rnd()*230|0,v=rnd();sky.s(sx,sy,v>0.9?'#fff6d8':v>0.55?'#b0a4e0':'#6a5aa8');if(v>0.97){sky.s(sx+1,sy,'#8a7ad0');sky.s(sx-1,sy,'#8a7ad0');sky.s(sx,sy+1,'#8a7ad0');sky.s(sx,sy-1,'#8a7ad0')}}
  for(let xx=0;xx<BW;xx++){const yc=62+Math.sin(xx*0.011)*22+Math.sin(xx*0.027+1)*10,st=0.55+0.45*Math.sin(xx*0.19+Math.sin(xx*0.05)*3);for(let k=-40;k<=18;k++){const y=Math.round(yc+k);const a=(k<0?Math.pow(1+k/40,1.4):Math.pow(1-k/18,2))*st;if(a>0.05)sky.b(xx,y,k<-14?'#9a6aff':k<-4?'#5affd0':'#7affa0',a*0.38)}}
  halo(sky,510,74,24,44,'#ffe8c8',0.7);disc(sky,510,74,24,(u,v,d)=>{const l=u*0.7+v*0.7;if(d>0.86&&l>0.2)return '#cbb08a';return l>0.55?'#d6bd96':l>0.25?'#e8d6b4':'#fbf2dc'});[[-8,-6,5],[6,4,4],[-2,9,3],[9,-8,2],[-11,4,2]].forEach(([a,b,r])=>disc(sky,510+a,74+b,r,(u,v)=>u+v>0?'#e0caa2':'#c8ae86'));
  const A=L[0].pb;mountains(A,272,175,0.006,1.3,'#3a2a6a','#4e3c88','#30225a',true,true);
  const Bm=L[1].pb,hb=mountains(Bm,300,110,0.011,4.7,'#2a1c52','#382668','#22164a',true,true);for(let xx=6;xx<Bm.w;xx+=9+(rnd()*12|0)){const gy=Math.round(hb[xx])+8;if(gy<BH-4)pine(Bm,xx,gy,14+(rnd()*16|0),'#1c1040','#2a1c56','#c9bde8')}for(let y=290;y<BH;y++)for(let xx=0;xx<Bm.w;xx++){const a=(y-290)/70;if(a*0.5>bay(xx,y))Bm.b(xx,y,'#7a5aa8',0.22)}

  const C=L[2].pb,hc=mountains(C,350,34,0.02,9.3,'#4a2228','#5a2a2e','#3e1c22',false,false);for(let xx=0;xx<C.w;xx+=16+(rnd()*20|0)){const r=14+(rnd()*14|0),gy=Math.round(hc[xx])+r*0.3;C.r(xx-2,gy,5,30,'#2e1418');blob(C,xx,gy,r,'#6a2e2c','#b85a3a','#4a2024',true)}}
 else if(th===2){weather='motes';
  gradient(sky,[[0,'#03040b'],[100,'#070a1a'],[220,'#0e1434'],[300,'#121840'],[360,'#0a0d24']]);
  const A=L[0].pb;for(let xx=0;xx<A.w;xx++){const top=Math.round(30+fbm(xx*0.013+2,5)*150*Math.pow(fbm(xx*0.004,3),1.2)),bot=Math.round(BH-20-fbm(xx*0.011+9,5)*150);for(let y=0;y<top;y++)A.s(xx,y,y>top-3?'#1e2858':'#121838');for(let y=bot;y<BH;y++)A.s(xx,y,y<bot+3?'#1e2858':'#121838')}
  for(let i=0;i<A.w/70;i++){const cx=rnd()*A.w|0,cy=80+rnd()*220|0,cyan=rnd()<0.6,c=cyan?['#7ff6ff','#3ad0e8','#1a7aa8']:['#ff9af6','#e05ad8','#8a2a8a'];halo(A,cx,cy,4,26,c[0],0.6);for(let k=0;k<3+(rnd()*3|0);k++){const len=6+rnd()*14|0,ang=-Math.PI/2+(rnd()-0.5)*1.4,ox=Math.round(Math.cos(ang)*len),oy=Math.round(Math.sin(ang)*len);for(let s=0;s<=len;s++){const px=cx+Math.round(ox*s/len),py=cy+Math.round(oy*s/len),w=Math.max(1,Math.round((1-s/len)*3));for(let q=-w;q<=w;q++)A.s(px+q,py,q<0?c[0]:q>0?c[2]:c[1])}}}
  for(let i=0;i<3;i++){const wx=200+i*900+rnd()*300|0;for(let y=0;y<BH;y++)for(let q=0;q<22;q++)if((y*2+q*7+i)%11<5)A.b(wx+q,y,'#4a6ac8',0.35)}
  const Bm=L[1].pb;for(let i=0;i<Bm.w/240;i++){const cx=i*240+rnd()*140|0,w=30+rnd()*50|0;

function startLocal(li){mode='local';game=H.createGame(li,localSchemes.filter(v=>v!=null).length);intro=3.2;parts=[];localSchemes.forEach((id,slot)=>{if(id!=null)H.addPlayer(game,slot)});game.fx.length=0;closeUI()}
function showPause(){screen='pause';if(mode==='local'){const p=panel('<h2>Paused</h2><p>'+esc(game.goal)+'</p><div class="row"><button id="bRes">Resume</button><button class="alt" id="bRe">Restart level</button><button class="alt" id="bLv">Levels</button><button class="alt" id="bQuit">Title</button></div>');
  p.querySelector('#bRes').onclick=closeUI;p.querySelector('#bRe').onclick=()=>startLocal(game.li);p.querySelector('#bLv').onclick=showLevels;p.querySelector('#bQuit').onclick=()=>{localSchemes=[];game=null;showTitle()}}
 else{const p=panel('<h2>Paused</h2><p>The game keeps running for everyone else.</p><div class="row"><button id="bRes">Resume</button>'+(net.host?'<button class="alt" id="bRe">Restart level</button><button class="alt" id="bLob">Back to lobby</button>':'')+'<button class="alt" id="bLeave">Leave room</button></div>');
  p.querySelector('#bRes').onclick=closeUI;if(net.host){p.querySelector('#bRe').onclick=()=>{send({t:'restart'});closeUI()};p.querySelector('#bLob').onclick=()=>send({t:'lobby'})}p.querySelector('#bLeave').onclick=leaveRoom}}
function showWin(){screen='win';const last=game.li>=H.LEVELS.length-1,nextW=!last&&Math.floor((game.li+1)/5)!==game.theme;
 const nextTxt=nextW?'Next world: '+H.THEMES[Math.floor((game.li+1)/5)]:'Next level';
 if(mode==='local'){done.add(game.li);saveDone();const p=panel('<h3>Level '+(game.li+1)+' clear!</h3><div class="row">'+(last?'<p>You reached the peak! Every level done.</p>':'<button id="bNext">'+esc(nextTxt)+'</button>')+'<button class="alt" id="bLv">Levels</button><button class="alt" id="bRe">Play again</button></div>');
  if(!last)p.querySelector('#bNext').onclick=()=>startLocal(game.li+1);p.querySelector('#bLv').onclick=showLevels;p.querySelector('#bRe').onclick=()=>startLocal(game.li)}
 else{const p=panel('<h3>Level '+(game.li+1)+' clear!</h3>'+(net.host?'<div class="row">'+(last?'':'<button id="bNext">'+esc(nextTxt)+'</button>')+'<button class="alt" id="bLob">Back to lobby</button></div>':'<p>Waiting for the host to pick what\'s next…</p>'));
  if(net.host){if(!last)p.querySelector('#bNext').onclick=()=>send({t:'start',level:game.li+1});p.querySelector('#bLob').onclick=()=>send({t:'lobby'})}}
 ui.firstChild.style.marginTop='26%'}

// ---------- online ----------
const net={ws:null,code:'',slot:-1,host:false,players:[],state:'',level:0,done:new Set(),snaps:[],lastIn:''};
// Client-side prediction: your own climber moves instantly; the server's answer corrects it smoothly.
const pr={p:null,world:null,log:[],q:0,k:0,last:null,jp:false,dp:false,acc:0,off:{x:0,y:0}};
function simEntry(W,me,e){me.input.x=e.x;me.input.jump=e.j;me.input.jumpP=e.jp;me.input.down=e.d;me.input.downP=e.dp;H.predictStep(W,me,H.STEP)}
function reconcile(d){const sp=d.P.find(p=>p.slot===net.slot);if(!sp||sp.dead||sp.ins||d.S.restartT>0||d.S.won||!game){pr.p=null;pr.world=null;pr.log.length=0;return}
 const rest=pr.log.filter(e=>e.q>sp.q||(e.q===sp.q&&e.k>=sp.m));pr.log=rest;
 const W=Object.create(game);W.S=structuredClone(d.S);W.fx=[];W.noWalls=false;W.crateOn=W.S.crates.map(()=>null);
 W.players=d.P.filter(q=>!q.dead&&!q.ins).map(q=>({slot:q.slot,x:q.x,y:q.y,w:H.PW,h:H.PH,vx:q.vx,vy:q.vy,face:q.face,grounded:q.gr,coyote:q.co,buffer:q.bu,cut:q.cut,squash:q.sq,anim:q.an,row:q.row||0,blinkT:q.bl,dead:0,inside:false,on:null,isPlayer:true,input:{x:0,jump:false,jumpP:false,downP:false}}));
 const me=W.players.find(p=>p.slot===net.slot);const old=pr.p?{x:pr.p.x+pr.off.x,y:pr.p.y+pr.off.y}:null;
 for(const e of rest)simEntry(W,me,e);
 if(me.dead){pr.p=null;pr.world=null;return}
 pr.p=me;pr.world=W;if(old){pr.off.x=old.x-me.x;pr.off.y=old.y-me.y;if(Math.hypot(pr.off.x,pr.off.y)>40)pr.off.x=pr.off.y=0}}
function send(o){if(net.ws&&net.ws.readyState===1)net.ws.send(JSON.stringify(o))}
function showOnline(err){mode='online-menu';screen='online';let nm='';try{nm=localStorage.getItem('hp-name')||''}catch(e){}
 const p=panel('<h2>Play online</h2><input id="nm" maxlength="12" placeholder="Your name" value="'+esc(nm)+'" aria-label="Your name"><div class="row"><button id="bCreate">Create a room</button></div><p>or join a friend</p><div class="row"><input id="code" class="code" maxlength="4" placeholder="CODE" aria-label="Room code"><button class="teal" id="bJoin">Join</button></div><div class="err" id="err">'+esc(err||'')+'</div><div class="row"><button class="alt" id="bBack">Back</button></div>');
 const nameOf=()=>{const v=p.querySelector('#nm').value.trim().slice(0,12)||'Climber';try{localStorage.setItem('hp-name',v)}catch(e){}return v};
 p.querySelector('#bCreate').onclick=()=>connect({t:'create',name:nameOf()});
 p.querySelector('#bJoin').onclick=()=>{const c=p.querySelector('#code').value.trim().toUpperCase();if(c.length!==4){p.querySelector('#err').textContent='Enter the 4-letter room code';return}connect({t:'join',code:c,name:nameOf()})};
 p.querySelector('#code').oninput=()=>p.querySelector('#err').textContent='';p.querySelector('#bBack').onclick=showTitle}
function connect(first){if(net.ws){try{net.ws.close()}catch(e){}}
 let ws;try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws')}catch(e){const el=document.getElementById('err');if(el)el.textContent='Could not reach the server';return}net.ws=ws;
 ws.onopen=()=>ws.send(JSON.stringify(first));
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}onMsg(m)};
 ws.onclose=()=>{if(net.ws===ws){net.ws=null;if(mode==='online'||screen==='lobby'){game=null;showOnline('Disconnected from the room')}}};
 ws.onerror=()=>{if(screen==='online'){const e=document.getElementById('err');if(e)e.textContent='Could not reach the server'}}}
function leaveRoom(){send({t:'leave'});if(net.ws)try{net.ws.close()}catch(e){}net.ws=null;game=null;showOnline()}
function onMsg(m){
 if(m.t==='err'){if(screen==='online'){const e=document.getElementById('err');if(e)e.textContent=m.msg}return}
 if(m.t==='room'){net.code=m.code;net.slot=m.you;net.host=m.host===m.you;net.players=m.players;net.state=m.state;net.level=m.level;net.done=new Set(m.done);
  if(m.state==='lobby'){mode='lobby';game=null;showLobby()}else if(screen==='lobby')closeUI();return}
 if(m.t==='s'){const d=m.d;if(!game||game.li!==d.li||game.n!==d.n||mode!=='online'){mode='online';const fresh=!game||game.li!==d.li;game=H.createGame(d.li,d.n);game.players=[];parts=[];net.snaps=[];pr.p=null;pr.world=null;pr.log.length=0;if(fresh)intro=3.2;if(screen==='lobby'||screen==='win')closeUI()}
  handleFx(d.fx||[],game);net.snaps.push({at:performance.now(),d});if(net.snaps.length>12)net.snaps.shift();reconcile(d);
  if(d.S.won&&screen!=='win'&&screen!=='pause'&&d.S.winT>0.6)showWin();if(!d.S.won&&screen==='win')closeUI()}}
function showLobby(){setKeys(true);screen='lobby';const L=H.LEVELS[net.level];const p=panel('<h3>Room code</h3><div class="bigcode">'+esc(net.code)+'</div><p>Friends open this page, choose Play online, and enter the code.</p><div class="plist">'+net.players.map(q=>'<div class="pl"><i style="background:'+PAL[q.slot].H+'"></i><div>'+esc(q.name)+(q.slot===net.slot?' <small>(you)</small>':'')+'<br><small>'+PAL[q.slot].n+(q.host?' · host':'')+'</small></div></div>').join('')+'</div>'
  +'<div class="row">'+(net.host?'<button id="bStart">Start '+(net.level+1)+': '+esc(L.name)+'</button>':'<p>Level '+(net.level+1)+': '+esc(L.name)+'. Waiting for the host to start…</p>')+'<button class="alt" id="bLeave">Leave</button></div>'
  +(net.host?'<h3>Pick a level</h3>':'')+levelGrid(net.level,net.done,net.host));
 if(net.host){p.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>send({t:'pick',level:+b.dataset.lv}));p.querySelector('#bStart').onclick=()=>send({t:'start',level:net.level})}
 p.querySelector('#bLeave').onclick=leaveRoom}
function interp(){const sn=net.snaps;if(!sn.length)return;const tgt=performance.now()-70;let a=sn[0],b=sn[sn.length-1];
 for(let i=0;i<sn.length-1;i++){if(sn[i].at<=tgt&&sn[i+1].at>=tgt){a=sn[i];b=sn[i+1];break}}
 if(tgt>=b.at)a=b;const al=a===b?1:clamp((tgt-a.at)/(b.at-a.at),0,1),L=(u,v)=>u+(v-u)*al;
 const A=a.d,Bd=b.d;H.applySnapshot(game,Bd);
 const S=Object.assign({},Bd.S);S.cam=L(A.S.cam,Bd.S.cam);S.t=A.S.t<=Bd.S.t?L(A.S.t,Bd.S.t):Bd.S.t;
 const lerpArr=(arrA,arrB,keys)=>arrB.map((o,i)=>{const p=arrA&&arrA[i];if(!p)return o;const c=Object.assign({},o);keys.forEach(k=>c[k]=L(p[k],o[k]));return c});
 S.crates=lerpArr(A.S.crates,Bd.S.crates,['x','y']);S.lifts=lerpArr(A.S.lifts,Bd.S.lifts,['x','y']);S.bridges=lerpArr(A.S.bridges,Bd.S.bridges,['y']);S.rafts=lerpArr(A.S.rafts,Bd.S.rafts,['x']);S.crush=lerpArr(A.S.crush,Bd.S.crush,['y']);
 S.bals=Bd.S.bals.map((bb,i)=>{const pa=A.S.bals[i];if(!pa)return bb;return Object.assign({},bb,{pans:bb.pans.map((pn,j)=>Object.assign({},pn,{y:L(pa.pans[j].y,pn.y)}))})});
 S.key=Object.assign({},Bd.S.key,{x:L(A.S.key.x,Bd.S.key.x),y:L(A.S.key.y,Bd.S.key.y)});game.S=S;
 for(const p of game.players){const pa=A.P.find(q=>q.slot===p.slot);if(pa&&Math.abs(pa.x-p.x)<40){p.x=L(pa.x,p.x);p.y=L(pa.y,p.y)}}
 if(pr.p){const me=game.players.find(p=>p.slot===net.slot);if(me&&!me.dead&&!me.inside)Object.assign(me,{x:pr.p.x+pr.off.x,y:pr.p.y+pr.off.y,vx:pr.p.vx,vy:pr.p.vy,face:pr.p.face,grounded:pr.p.grounded,squash:pr.p.squash,anim:pr.p.anim,row:pr.p.row})}}

// ---------- loop ----------
function fit(){const st=document.getElementById('stage'),aw=st.clientWidth,ah=Math.max(200,innerHeight-130);let k=Math.min(aw/BW,ah/BH);if(k>=2)k=Math.floor(k*2)/2;scr.width=Math.round(BW*k);scr.height=Math.round(BH*k);scr.style.width=scr.width+'px';scr.style.height=scr.height+'px'}
new ResizeObserver(fit).observe(document.getElementById('stage'));addEventListener('resize',fit);fit();
let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(0.1,(now-last)/1000);last=now;TT+=dt;
 shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);intro=Math.max(0,intro-dt);toastT=Math.max(0,toastT-dt);for(const k in springT)springT[k]-=dt;
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.vx*=1-dt*2;q.life-=dt}parts=parts.filter(q=>q.life>0);if(parts.length>700)parts.splice(0,parts.length-700);
 let g=null;
 if(mode==='local'&&game){g=game;
  for(let id=0;id<8;id++){const r=readScheme(id);if(!r)continue;const slot=localSchemes.indexOf(id);
   if(slot>=0){const p=g.players.find(q=>q.slot===slot);if(p){const blocked=!!screen;if(r.jp&&!blocked)p.input.jumpP=true;if(r.d&&!p.input.down&&!blocked)p.input.downP=true;p.input.x=blocked?0:r.x;p.input.jump=!blocked&&r.j;p.input.down=r.d}}
   else if(r.jp&&!screen&&!g.S.won){const fr=[0,1,2,3].find(s=>localSchemes[s]==null);if(fr!=null){localSchemes[fr]=id;H.addPlayer(g,fr)}}}
  if(screen!=='pause'){acc+=dt;while(acc>=H.STEP){H.step(g,H.STEP);H.clearEdges(g);acc-=H.STEP}}else acc=0;
  handleFx(g.fx.splice(0),g);if(g.S.won&&g.S.winT>0.6&&screen!=='win')showWin()}
 else if(mode==='online'&&game){g=game;const inp=screen==='pause'?{x:0,j:false,d:false}:onlineInput();
  if(!pr.last||inp.x!==pr.last.x||inp.j!==pr.last.j||inp.d!==pr.last.d){pr.q++;pr.k=0;if(inp.j&&!(pr.last&&pr.last.j))pr.jp=true;if(inp.d&&!(pr.last&&pr.last.d))pr.dp=true;pr.last=inp;send({t:'in',x:inp.x,j:inp.j,d:inp.d,q:pr.q})}
  pr.acc+=dt;let ns=0;while(pr.acc>=H.STEP&&ns<14){const e={q:pr.q,k:pr.k++,x:inp.x,j:inp.j,jp:pr.jp,d:inp.d,dp:pr.dp};pr.jp=pr.dp=false;pr.log.push(e);if(pr.log.length>720)pr.log.shift();if(pr.p&&pr.world)simEntry(pr.world,pr.p,e);pr.acc-=H.STEP;ns++}if(ns>=14)pr.acc=0;
  const dec=Math.exp(-dt*10);pr.off.x*=dec;pr.off.y*=dec;interp()}
 else{demoT+=dt;if(demoT>9){demoT=0;demoW=(demoW+1)%5;demo=H.createGame(demoW*5+(demoW===0?0:1))}g=demo;demo.S.t+=dt;demo.S.cam=(Math.sin(demoT*0.12-1.2)*0.5+0.5)*Math.min(demo.LW-VW,700)}
 draw(g,dt);hit.clear();requestAnimationFrame(frame)}
showTitle();requestAnimationFrame(frame);
window.__hp={get game(){return game},net,pr,startLocal,get mode(){return mode},draw,buf,buildBG,buildWorld,setCam:v=>camX=v};
}
